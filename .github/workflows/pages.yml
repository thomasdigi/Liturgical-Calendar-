# Builds the texts with Divinum Officium's engine and publishes the site to GitHub Pages.
#
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
# It runs by itself whenever changes are merged into main, and on the 1st of each month to roll
# the dates forward. To choose different months, calendars or languages, run it from the Actions
# tab ("Build and publish site" → Run workflow).
#
# Size: each psalm and prayer is stored once (scripts/site.ts), about a quarter of the old size:
# a month of one language is roughly 2.5 MB with its search index. GitHub Pages sites should stay
# under 1 GB; the defaults (three months, General 1962, eight languages plus the chant, all
# votive offices) come to about 60 MB (before, about 600 MB).
name: Build and publish site

on:
  workflow_dispatch:
    inputs:
      start:
        description: First month to build (YYYY-MM); leave empty for the current month
        default: ''
      months:
        description: Number of months to build
        default: '3'
      calendars:
        description: Calendars (general, usa, brazil)
        default: general
      versions:
        description: Versions (1962, 1954, 1906, 1570, op1962 = Dominican, m1963 = Monastic)
        default: '1962'
      languages:
        description: Languages (en, la-bea, cs, da, de, es, fr, it, hu, hu-kaldi, nl, pl, pl-newer, pt, vi, uk, he; la-gabc is the chant notation)
        default: en,la-bea,es,fr,de,it,pt,pl,la-gabc
      votives:
        description: Votive offices (dead, parvum, sabbato, or none)
        default: dead,parvum,sabbato
  schedule:
    - cron: '17 4 1 * *'
  # Rebuild and republish whenever changes are merged into main (with the default settings above).
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      START: ${{ inputs.start || '' }}
      MONTHS: ${{ inputs.months || '3' }}
      CALENDARS: ${{ inputs.calendars || 'general' }}
      VERSIONS: ${{ inputs.versions || '1962' }}
      LANGUAGES: ${{ inputs.languages || 'en,la-bea,es,fr,de,it,pt,pl,la-gabc' }}
      VOTIVE_OFFICES: ${{ inputs.votives || 'dead,parvum,sabbato' }}
      # The site's address, so calendar events can link back to their day.
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Perl libraries for Divinum Officium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcgi-pm-perl libdate-calc-perl libtimedate-perl liburi-perl \
            liburl-encode-perl libalgorithm-diff-perl libcgi-session-perl

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Days built by earlier runs are kept (GitHub's cache), so only new days are built: a few
      # minutes instead of 40. The key changes whenever anything that shapes the texts changes
      # (our code, Divinum Officium's version, the votive offices), and then everything is rebuilt.
      - name: Fingerprint of what shapes the texts
        id: fingerprint
        run: echo "key=days-${{ hashFiles('src/**', 'package-lock.json') }}-$(git rev-parse HEAD:vendor/divinum-officium)-${VOTIVE_OFFICES//,/_}" >> "$GITHUB_OUTPUT"

      - name: Restore the days built before
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ${{ steps.fingerprint.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.fingerprint.outputs.key }}-

      - name: Test
        run: npm test

      - name: Build texts
        run: |
          if [ -n "$START" ]; then FROM="$START-01"; else FROM=$(date -u +%Y-%m-01); fi
          TO=$(date -u -d "$FROM +${MONTHS} month -1 day" +%Y-%m-%d)
          echo "Building $FROM to $TO: calendars=$CALENDARS versions=$VERSIONS languages=$LANGUAGES"
          # --prune: drop days and languages this build didn't ask for (keeps the kept copy small).
          npm run build -- "$FROM" "$TO" --calendar "$CALENDARS" --version "$VERSIONS" --lang "$LANGUAGES" --votive "$VOTIVE_OFFICES" --prune

      - name: Keep the days for next time
        uses: actions/cache/save@v4
        with:
          path: data
          key: ${{ steps.fingerprint.outputs.key }}-${{ github.run_id }}

      - name: Assemble site
        run: npm run site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
