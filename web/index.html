<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divine Office 1962</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <nav class="datenav" aria-label="Date">
      <button id="prev" aria-label="Previous day">‹</button>
      <input id="date" type="date" aria-label="Date">
      <button id="next" aria-label="Next day">›</button>
      <button id="today">Today</button>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="both" aria-pressed="true">Both</button>
      <button data-lang="latin" aria-pressed="false">Latin</button>
      <button data-lang="english" aria-pressed="false">English</button>
    </div>
  </header>

  <main>
    <section class="day" id="day" aria-live="polite">
      <p class="weekday" id="weekday"></p>
      <h1 id="title">Loading…</h1>
      <p class="meta"><span class="swatch" id="swatch"></span><span id="rank"></span></p>
      <p class="comm" id="comm"></p>
    </section>

    <nav class="hours" id="hours" role="tablist" aria-label="Hours"></nav>

    <article id="office" class="office"></article>
  </main>

  <footer>
    Texts generated by <a href="https://www.divinumofficium.com/">Divinum Officium</a>
    (MIT License) · Rubrics 1960 (1962 books)
  </footer>
  <script src="app.js"></script>
</body>
</html>
