<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divine Office and Mass</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply a saved light/dark choice before first paint (no saved choice = follow the system).
    try { const t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="top">
    <nav class="datenav" aria-label="Date">
      <button id="prev" type="button" aria-label="Previous day">‹</button>
      <input id="date" type="date" aria-label="Date">
      <button id="next" type="button" aria-label="Next day">›</button>
      <button id="today" type="button">Today</button>
    </nav>
    <div class="settings">
      <label class="select"><span>Calendar</span><select id="calendar"></select></label>
      <label class="select"><span>Version</span><select id="version"></select></label>
      <label class="select"><span>Language</span><select id="lang"></select></label>
      <button type="button" id="theme" class="theme" aria-pressed="false" title="Switch between light and dark">
        <span class="theme-icon" aria-hidden="true"></span><span class="theme-label">Dark mode</span>
      </button>
    </div>
  </header>

  <main>
    <section class="day" aria-live="polite">
      <p class="weekday" id="weekday"></p>
      <h1 id="title">Loading…</h1>
      <p class="meta"><span class="swatch" id="swatch"></span><span id="rank"></span></p>
      <p class="comm" id="comm"></p>
    </section>

    <div class="view seg big" id="view" role="group" aria-label="Mass or Office">
      <button type="button" data-view="mass" aria-pressed="false">Mass</button>
      <button type="button" data-view="office" aria-pressed="true">Divine Office</button>
    </div>

    <div class="massmode" id="massmode">
      <div class="seg" role="group" aria-label="Parts of the Mass">
        <button type="button" data-mass="propers" aria-pressed="true">Propers only</button>
        <button type="button" data-mass="full" aria-pressed="false" id="full-btn">Full Mass</button>
      </div>
      <p class="hint" id="full-hint" hidden></p>
    </div>

    <nav class="hours" id="hours" role="tablist" aria-label="Hours"></nav>

    <div class="toolbar" aria-label="Display">
      <div class="seg" id="display" role="group" aria-label="Languages shown">
        <button type="button" data-display="both" aria-pressed="true">Both</button>
        <button type="button" data-display="latin" aria-pressed="false">Latin</button>
        <button type="button" data-display="vernacular" aria-pressed="false" id="vernacular-btn">English</button>
      </div>
      <div class="seg" id="layout" role="group" aria-label="Layout">
        <button type="button" data-layout="interlinear" aria-pressed="true">Interlinear</button>
        <button type="button" data-layout="side" aria-pressed="false">Side by side</button>
      </div>
    </div>

    <p class="fallback" id="fallback" hidden></p>

    <article id="text" class="text"></article>
  </main>

  <footer>
    Texts generated by <a href="https://www.divinumofficium.com/">Divinum Officium</a> (MIT License).
    <span id="source-version"></span>
  </footer>

  <dialog id="info" class="info-dialog" aria-labelledby="info-title">
    <form method="dialog">
      <h2 id="info-title">Not fully translated</h2>
      <p id="info-text"></p>
      <label class="info-alt">
        <span>Show the missing text in</span>
        <select id="alt-lang"></select>
      </label>
      <p class="info-note">Your choice is remembered for every page.</p>
      <div class="info-actions"><button type="submit" id="info-close">Done</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
